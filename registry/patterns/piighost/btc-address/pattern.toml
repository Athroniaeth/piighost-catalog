schema_version = 1

[pattern]
name = "btc-address"
title = { en = "Bitcoin address", fr = "adresse Bitcoin" }
label = "BTC_ADDRESS"
tags = ["international", "identity", "finance"]
regex = '\b(?:[13][1-9A-HJ-NP-Za-km-z]{25,34}|bc1[02-9ac-hj-np-z]{11,71})\b'

[pattern.description]
en = "Bitcoin address in the three live encodings: legacy P2PKH starting with 1, P2SH starting with 3, both over the Base58 alphabet that drops zero, capital O, capital I and lowercase l, and bech32 SegWit starting with bc1. The Base58 branch is the noisy one, plenty of opaque identifiers of twenty-six to thirty-five characters happen to start with 1 or 3 and match. The bech32 branch is far more precise thanks to its prefix, so ship bc1 alone if false positives matter. No collision with any existing pattern."
fr = "Adresse Bitcoin dans ses trois encodages vivants : P2PKH hérité commençant par 1, P2SH commençant par 3, tous deux sur l'alphabet Base58 qui écarte le zéro, le O majuscule, le I majuscule et le l minuscule, et bech32 SegWit commençant par bc1. La branche Base58 est la bruyante : quantité d'identifiants opaques de vingt-six à trente-cinq caractères commencent par 1 ou 3 et sont reconnus. La branche bech32 est bien plus précise grâce à son préfixe ; ne livrer que bc1 si les faux positifs comptent. Aucune collision avec un motif existant."

# Adresse P2PKH héritée, tirée de la documentation Bitcoin.
[[examples.match]]
text = "Le don est arrivé sur 1BvBMSEYstWetqTFn5Au4m4GFg7xJaNVN2 hier."
value = "1BvBMSEYstWetqTFn5Au4m4GFg7xJaNVN2"

# Vecteur de test du BIP-173.
[[examples.match]]
text = "Adresse SegWit bc1qw508d6qejxtdg4y5r3zarvary0c5xw7kv8f3t4 dans la facture."
value = "bc1qw508d6qejxtdg4y5r3zarvary0c5xw7kv8f3t4"

# Zéro en tête : hors de l'alphabet Base58.
[[examples.no_match]]
text = "0BvBMSEYstWetqTFn5Au4m4GFg7xJaNVN2"

# Le préfixe seul ne suffit pas.
[[examples.no_match]]
text = "bc1"

[redos]
prefix = ""
filler = "1A "
suffix = "x"
