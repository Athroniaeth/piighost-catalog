schema_version = 1

[pattern]
name = "it-phone"
title = { en = "phone number (Italy)", fr = "numéro de téléphone (Italie)" }
label = "IT_PHONE"
tags = ["it", "contact"]
regex = '(?<![\w+])(?:\+39[\s.-]?)?(?:3\d{2}|0\d{1,3})[\s.-]?\d{5,8}(?!\w)'

[pattern.description]
en = "Italian phone number: an optional +39, then a mobile prefix starting 3 or a landline area code starting 0, then the subscriber digits. Italy keeps the leading 0 when dialling, unlike most of Europe."
fr = "Numéro de téléphone italien : un +39 optionnel, puis un préfixe mobile commençant par 3 ou un indicatif de zone commençant par 0, puis les chiffres d'abonné. L'Italie conserve le 0 initial à la composition, contrairement à la plupart de l'Europe."

[[examples.match]]
text = "Chiama il +39 06 12345678 in mattinata."
value = "+39 06 12345678"

[[examples.match]]
text = "Cellulare 331 1234567 sempre attivo."
value = "331 1234567"

[[examples.no_match]]
text = "Chiama il 12345"

[[examples.no_match]]
text = "Numero 991 1234567"

[redos]
prefix = "+39 "
filler = "06"
suffix = "x"
