schema_version = 1

[pattern]
name = "cl-rut"
label = "CL_RUT"
tags = ["cl", "government-id", "identity"]
regex = '(?<!\w)\d{1,2}\.?\d{3}\.?\d{3}-[0-9kK](?!\w)'

[pattern.description]
en = "Chilean national identity number, the RUT or RUN: seven or eight digits, optionally grouped with periods, then a hyphen and one check character which is a digit or the letter K. Purview documents exactly that layout for the Chile identity card, and Cloudflare publishes 12.345.678-5 as its sample. The check character is not verified. Reproduced collisions: the dotted form 12.345.678-5 is matched whole by PL_PHONE, which accepts periods and hyphens between its nine digits, and the plain form 76543210-K is matched whole by ES_DNI_NIE, which reads eight digits, an optional hyphen and a letter."
fr = "Numéro national d'identité chilien, le RUT ou RUN : sept ou huit chiffres, groupés ou non par des points, puis un trait d'union et un caractère de contrôle qui est un chiffre ou la lettre K. Purview documente exactement cette disposition pour la carte d'identité chilienne, et Cloudflare publie 12.345.678-5 comme exemple. Le caractère de contrôle n'est pas vérifié. Collisions reproduites : la forme pointée 12.345.678-5 est reconnue en entier par PL_PHONE, qui accepte points et traits d'union entre ses neuf chiffres, et la forme simple 76543210-K est reconnue en entier par ES_DNI_NIE, qui lit huit chiffres, un trait d'union facultatif et une lettre."

[[examples.match]]
text = "El RUT 12.345.678-5 aparece en la boleta."
value = "12.345.678-5"

[[examples.match]]
text = "The number 76543210-K ends with the K check character."
value = "76543210-K"

[[examples.no_match]]
text = "12.345.678"

[[examples.no_match]]
text = "12.345.678-Z"

[[examples.no_match]]
text = "1234567805"

[redos]
prefix = ""
filler = "12.345.678-"
suffix = "x"
