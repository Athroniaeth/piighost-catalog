schema_version = 1

[config]
name = "support-en"
title = { en = "English support conversations", fr = "conversations de support en anglais" }
description = { en = "English support conversations: US and international shapes with a local model for names and companies, and a guard that refuses a reply still holding a clear email address. The guard costs a second detection pass and is worth it on a channel an agent forwards.", fr = "Conversations de support en anglais : formes américaines et internationales avec un modèle local pour les noms et sociétés, et un guard qui refuse une réponse contenant encore une adresse e-mail en clair. Le guard coûte une seconde passe de détection et le vaut sur un canal qu'un agent transfère." }
tags = ["us", "international", "lang-en", "customer-support", "chat", "tool-agent"]
piighost = ">=2.0,<3"

# The model detector comes first, and it used to arrive by inheriting
# piighost/ner-base. That object carried nothing else, and a registry of
# tested regexes could say nothing about it: the checks replay examples,
# bound backtracking and verify composition, none of which mean anything for
# a model. It is declared here instead, where it is the one detector this
# config does not guarantee.
[[detectors]]
name = "ner"
type = "gliner2"
model = "fastino/gliner2-multi-v1"
labels = ["PERSON", "ADDRESS", "ORGANIZATION"]
threshold = 0.5

[[detectors]]
name = "regex-us"
type = "regex"
groups = ["piighost/us-extended"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

# The model finds a whole address and the ZIP regex finds the five digits
# inside it. Keeping the surer span kept the ZIP and sent the street in clear,
# so the union of overlapping spans is kept.
[stages.overlap_resolver]
type = "merge"

[stages.linker]
type = "exact"

[stages.anonymizer.placeholder]
type = "label_counter"

[stages.expander]
type = "word_boundary"

[stages.guard]
type = "detector"

[stages.guard.detector]
type = "regex"
patterns = { EMAIL = '(?<![A-Za-z0-9._%+-])[A-Za-z0-9._%+-]+@(?:[A-Za-z0-9-]+\.)+[A-Za-z]{2,}' }
