schema_version = 1

[config]
name = "regex-default"
title = { en = "regex only, no model", fr = "regex seules, sans modèle" }
description = { en = "Regex only, no model, no network: the French, European, US and generic groups, in that order. France comes before the generic group, so a SIRET or a NIR is not taken for a card number. It holds no secret pattern. For API keys and tokens, use dev-secrets.", fr = "Regex seules, sans modèle ni réseau : les groupes français, européen, américain et générique, dans cet ordre. La France passe avant le groupe générique, pour qu'un SIRET ou un NIR ne soit pas pris pour une carte bancaire. Elle ne contient aucun motif de secret. Pour les clés d'API et les jetons, utilisez dev-secrets." }
tags = ["international", "fr", "eu", "us", "chat", "tool-agent"]
piighost = ">=2.0,<3"

[[detectors]]
name = "regex-fr"
type = "regex"
groups = ["piighost/fr"]

[[detectors]]
name = "regex-eu"
type = "regex"
groups = ["piighost/eu"]

[[detectors]]
name = "regex-us"
type = "regex"
groups = ["piighost/us"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

[stages.linker]
type = "exact"

[stages.anonymizer.placeholder]
type = "label_counter"
