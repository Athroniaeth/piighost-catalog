schema_version = 1

[pattern]
name = "jp-my-number"
title = { en = "My Number (Japan)", fr = "My Number (Japon)" }
label = "JP_MY_NUMBER"
tags = ["jp", "government-id", "identity"]
regex = '(?<!\w)\d{4}[\s-]\d{4}[\s-]\d{4}(?!\w)(?![\s.-]?\d)'

[pattern.description]
en = "Japanese individual number, twelve digits in three groups of four. The separator is required rather than optional: twelve bare digits are also a phone number and a card number fragment, and the grouped form is how the number is printed on the notification card."
fr = "Numéro individuel japonais, douze chiffres en trois groupes de quatre. Le séparateur est exigé et non optionnel : douze chiffres nus sont aussi un numéro de téléphone et un fragment de numéro de carte, et la forme groupée est celle imprimée sur la carte de notification."

[[examples.match]]
text = "My Number 1234 5678 9012 is on the form."
value = "1234 5678 9012"

[[examples.match]]
text = "Enter 9876-5432-1098 in the tax field."
value = "9876-5432-1098"

[[examples.no_match]]
text = "The number 123456789012 has no groups"

[[examples.no_match]]
text = "Reference 1234 5678 901"

[redos]
prefix = "1234 "
filler = "5678"
suffix = "x"
