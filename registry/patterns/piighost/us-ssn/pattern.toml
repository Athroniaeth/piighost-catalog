schema_version = 1

[pattern]
name = "us-ssn"
title = { en = "SSN (US)", fr = "SSN (États-Unis)" }
label = "US_SSN"
tags = ["us", "government-id", "identity", "hr"]
regex = '\b\d{3}-\d{2}-\d{4}\b'

[pattern.description]
en = "US Social Security number in its hyphenated 3-2-4 form. Forbidden areas (000, 666, 9xx) and unhyphenated values are not handled; any AAA-GG-SSSS digit group is reported."
fr = "Numéro de sécurité sociale américain (SSN) dans sa forme 3-2-4 avec tirets. Les zones interdites (000, 666, 9xx) et les valeurs sans tiret ne sont pas gérées ; tout groupe de chiffres AAA-GG-SSSS est signalé."


# 987-65-4320 à 987-65-4329 : plage réservée par la SSA à la publicité.
[[examples.match]]
text = "SSN 123-45-6789 on file."
value = "123-45-6789"

[[examples.match]]
text = "Applicant 987-65-4321 approved"
value = "987-65-4321"

# Mauvais découpage.
[[examples.no_match]]
text = "123-456-789"

# Sans tirets : non couvert.
[[examples.no_match]]
text = "123456789"

[redos]
prefix = "123-45-6789 "
filler = "123-45-"
suffix = "x"
