schema_version = 1

[config]
name = "uk-default"
description = { en = "the United Kingdom without a model: phone, postcode, the National Insurance number, the NHS number and the VAT number, plus the email, URL, IPv4 and card number that belong to no country. Word-boundary expansion catches a value detected once everywhere else in the message.", fr = "Royaume-Uni sans modèle : téléphone, code postal, le numéro d'assurance nationale, le numéro NHS et le numéro de TVA, plus l'e-mail, l'URL, l'IPv4 et le numéro de carte qui n'appartiennent à aucun pays. L'expansion par mot entier reprend partout dans le message une valeur détectée une fois." }
tags = ["chat", "customer-support", "document", "uk"]
piighost = ">=1.7,<2"

[[detectors]]
name = "regex-uk"
type = "regex"
groups = ["piighost/uk"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

[stages.linker]
type = "exact"

[stages.expander]
type = "word_boundary"

[stages.anonymizer.placeholder]
type = "label_counter"
