[group]
name = "business"
title = { en = "company and tax numbers", fr = "numéros d'entreprise et numéros fiscaux" }
description = { en = "Company and tax numbers across the countries the catalog covers: the British VAT number, the European VAT number, the French SIRET, the Spanish CIF, the Brazilian CNPJ, the Indian PAN, the Australian ABN, the American EIN, the Indian GST number and the Mexican RFC. Useful on an invoice or a contract, where the company identifies more reliably than the signatory. The British number goes first: a GB VAT number written solid also matches the European pattern, and the United Kingdom left that system. Two are deliberately absent: the Portuguese NIF and the Italian VAT number are nine and eleven bare digits, which the other members already claim.", fr = "Numéros d'entreprise et numéros fiscaux des pays couverts par le catalogue : le numéro de TVA britannique, le numéro de TVA européen, le SIRET français, le CIF espagnol, le CNPJ brésilien, le PAN indien, l'ABN australien, l'EIN américain, le numéro GST indien et le RFC mexicain. Utile sur une facture ou un contrat, où l'entreprise identifie plus sûrement que le signataire. Le numéro britannique passe en premier : un numéro de TVA GB écrit d'un bloc correspond aussi au motif européen, et le Royaume-Uni a quitté ce système. Deux sont volontairement absents : le NIF portugais et la partita IVA italienne font neuf et onze chiffres nus, que les autres membres revendiquent déjà." }
tags = ["international", "business", "accounting", "finance", "document"]

