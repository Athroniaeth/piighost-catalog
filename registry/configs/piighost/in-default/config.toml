schema_version = 1

[config]
name = "in-default"
title = { en = "India, regex only", fr = "Inde, regex seules" }
description = { en = "India without a model: phone, PIN code, the PAN tax number, the Aadhaar number and the GST number, plus the email, URL, IPv4 and card number that belong to no country. Word-boundary expansion catches a value detected once everywhere else in the message.", fr = "Inde sans modèle : téléphone, code PIN, le numéro fiscal PAN, le numéro Aadhaar et le numéro GST, plus l'e-mail, l'URL, l'IPv4 et le numéro de carte qui n'appartiennent à aucun pays. L'expansion par mot entier reprend partout dans le message une valeur détectée une fois." }
tags = ["chat", "customer-support", "document", "in"]
piighost = ">=2.0,<3"

[[detectors]]
name = "regex-in"
type = "regex"
groups = ["piighost/in"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

[stages.linker]
type = "exact"

[stages.expander]
type = "word_boundary"

[stages.anonymizer.placeholder]
type = "label_counter"
