schema_version = 1

[config]
name = "fr-default"
description = { en = "France without a model: phone, IBAN, social security number and company registration number, plus the European IBAN and VAT number, plus the email, URL, IPv4 and card number that belong to no country. Word-boundary expansion catches a value detected once everywhere else in the message.", fr = "France sans modèle : téléphone, IBAN, numéro de sécurité sociale et numéro d'entreprise, plus l'IBAN et le numéro de TVA européens, plus l'e-mail, l'URL, l'IPv4 et le numéro de carte qui n'appartiennent à aucun pays. L'expansion par mot entier reprend partout dans le message une valeur détectée une fois." }
tags = ["chat", "customer-support", "document", "eu", "fr"]
piighost = ">=2.0,<3"

[[detectors]]
name = "regex-fr"
type = "regex"
groups = ["piighost/fr"]

[[detectors]]
name = "regex-eu"
type = "regex"
groups = ["piighost/eu-extended"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

[stages.linker]
type = "exact"

[stages.expander]
type = "word_boundary"

[stages.anonymizer.placeholder]
type = "label_counter"
