schema_version = 1

[pattern]
name = "br-cpf"
title = { en = "CPF taxpayer number (Brazil)", fr = "numéro fiscal CPF (Brésil)" }
label = "BR_CPF"
tags = ["br", "government-id", "identity"]
regex = '\b\d{3}\.\d{3}\.\d{3}-\d{2}\b'

[pattern.description]
en = "Brazilian CPF taxpayer number in its punctuated form. The punctuation is required, and that requirement is what makes the pattern usable at all: an unpunctuated CPF is eleven bare digits and is missed by design. Both examples are the checksum-valid values that circulate in Brazilian developer documentation as test CPFs. Do not relax the punctuation: a bare eleven digit run collides head on with the existing de-phone whenever it starts with a zero."
fr = "Numéro fiscal brésilien CPF dans sa forme ponctuée. La ponctuation est exigée, et c'est cette exigence qui rend le motif utilisable : un CPF sans ponctuation n'est qu'une suite de onze chiffres et échappe volontairement au motif. Les deux exemples sont les valeurs à somme de contrôle correcte qui circulent dans la documentation des développeurs brésiliens comme CPF de test. Ne relâchez pas la ponctuation : une suite nue de onze chiffres entre en collision frontale avec le motif existant de-phone dès qu'elle commence par un zéro."

# CPF de test publié, somme de contrôle valide.
[[examples.match]]
text = "CPF 111.444.777-35 informado."
value = "111.444.777-35"

# Autre CPF de test publié.
[[examples.match]]
text = "O cadastro traz 529.982.247-25 como titular."
value = "529.982.247-25"

# Le groupe de contrôle manque.
[[examples.no_match]]
text = "529.982.247"

# Sans ponctuation : volontairement ignoré.
[[examples.no_match]]
text = "52998224725"

[redos]
prefix = ""
filler = "123.456.789-"
suffix = "x"
