schema_version = 1

[pattern]
name = "br-rg"
label = "BR_RG"
tags = ["br", "government-id", "identity"]
regex = '(?<!\w)(?:\d{2}\.\d{3}\.\d{3}-\d|\d{10}-\d)(?!\w)'

[pattern.description]
en = "Brazilian national identity card number, the RG, in the two layouts Purview documents: the old Registro Geral as two digits, a period, three digits, a period, three digits, a hyphen and one check digit, and the newer Registro de Identidade as ten digits, a hyphen and one check digit. The separators are required, a bare run of digits is not matched. Purview describes the check character as a digit, so RG numbers whose check character is the letter X, common in some states, are not matched here. Reproduced collision: the dotted form is matched whole by PL_PHONE, which accepts periods and hyphens between its nine digits; BR_CPF is not touched, since it groups three, three, three and two."
fr = "Numéro de la carte nationale d'identité brésilienne, le RG, dans les deux dispositions que documente Purview : l'ancien Registro Geral, deux chiffres, un point, trois chiffres, un point, trois chiffres, un trait d'union et une clé, et le plus récent Registro de Identidade, dix chiffres, un trait d'union et une clé. Les séparateurs sont obligatoires, une simple suite de chiffres n'est pas reconnue. Purview décrit la clé comme un chiffre, donc les RG dont la clé est la lettre X, courante dans certains États, ne sont pas reconnus ici. Collision reproduite : la forme pointée est reconnue en entier par PL_PHONE, qui accepte points et traits d'union entre ses neuf chiffres ; BR_CPF n'est pas touché, puisqu'il groupe trois, trois, trois et deux."

[[examples.match]]
text = "O RG 12.345.678-9 consta na carteira de identidade."
value = "12.345.678-9"

[[examples.match]]
text = "The RIC number 1234567890-1 uses the newer layout."
value = "1234567890-1"

[[examples.no_match]]
text = "12345678-9"

[[examples.no_match]]
text = "12.345.678"

[[examples.no_match]]
text = "123456789-1"

[redos]
prefix = ""
filler = "12.345.678-"
suffix = "x"
