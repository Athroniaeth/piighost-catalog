schema_version = 1

[pattern]
name = "us-driving-licence"
title = { en = "driver's license number (US)", fr = "numéro de permis de conduire (États-Unis)" }
label = "US_DRIVING_LICENCE"
tags = ["us", "government-id", "identity"]
regex = '(?<!\w)(?:[A-Z]\d{7}|\d{3} \d{3} \d{3})(?!\w)'

[pattern.description]
en = "United States driver licence number. There is no national format, every state issues its own, so this covers only the two common shapes that vendors actually implement: one letter followed by seven digits, the California style that Presidio and the Cloudflare sample CA License A1234567 both carry, and nine digits written as three spaced groups, which is the only state form Purview defines, for New York, and which Purview says does not match when written without the spaces. States that issue plain six to fourteen digit numbers are left out on purpose, since a bare digit run of that length carries no signal. Reproduced collision: the spaced form 123 456 789 is matched whole by CA_SIN and by PL_PHONE."
fr = "Numéro de permis de conduire des États-Unis. Il n'existe pas de format national, chaque État émet le sien, donc seules les deux formes courantes que les éditeurs implémentent sont couvertes : une lettre suivie de sept chiffres, la forme californienne que portent Presidio et l'exemple Cloudflare CA License A1234567, et neuf chiffres écrits en trois groupes séparés par des espaces, seule forme d'État définie par Purview, pour New York, et que Purview déclare non reconnue sans les espaces. Les États qui émettent de simples suites de six à quatorze chiffres sont volontairement exclus, une telle suite ne portant aucun signal. Collision reproduite : la forme espacée 123 456 789 est reconnue en entier par CA_SIN et par PL_PHONE."

[[examples.match]]
text = "The California style number A1234567 is printed under the photo."
value = "A1234567"

[[examples.match]]
text = "New York writes the same licence as 123 456 789 with spaces."
value = "123 456 789"

[[examples.no_match]]
text = "A123456"

[[examples.no_match]]
text = "123456789"

[[examples.no_match]]
text = "a1234567"

[redos]
prefix = ""
filler = "123 456 78"
suffix = "!"
