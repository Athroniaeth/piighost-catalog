schema_version = 1

[pattern]
name = "fr-date-numeric"
label = "FR_DATE_NUMERIC"
tags = ["fr", "identity", "legal", "notarial", "lang-fr"]
regex = '(?<![\w/.-])(?:0?[1-9]|[12]\d|3[01])([/.-])(?:0?[1-9]|1[0-2])\1(?:1[89]|20)\d{2}(?!\w|[/.-]\d)'

[pattern.description]
en = "A date in digits, day first as France writes it: day, month and a four-digit year from 1800 to 2099, with the same separator twice, a slash, a dot or a hyphen. Like fr-date it hides a date of birth and the date of the document alike. A two-digit year is left out, since 12/03/85 is as often a reference as a date."
fr = "Une date en chiffres, le jour d'abord comme l'écrit la France : jour, mois et année à quatre chiffres de 1800 à 2099, avec deux fois le même séparateur, une barre oblique, un point ou un tiret. Comme fr-date, il masque une date de naissance comme la date du document. Une année à deux chiffres est laissée de côté, car 12/03/85 est aussi souvent une référence qu'une date."

[[examples.match]]
text = "Date de naissance : 12/03/1985"
value = "12/03/1985"

[[examples.match]]
text = "Né le 05.11.1990 à Lyon."
value = "05.11.1990"

[[examples.match]]
text = "Visite du 1-2-2003, sans suite."
value = "1-2-2003"

# Année à deux chiffres : laissée de côté.
[[examples.no_match]]
text = "le 12/03/85"

# Deux séparateurs différents.
[[examples.no_match]]
text = "12/03-1985"

# Mois 13 : refusé.
[[examples.no_match]]
text = "13/13/1985"

# Une date plus longue n'est pas coupée en deux.
[[examples.no_match]]
text = "ref 12/03/1985/4"

[redos]
prefix = "12/03/"
filler = "1/"
suffix = "x"
