schema_version = 1

[pattern]
name = "sendgrid-api-key"
label = "SENDGRID_API_KEY"
tags = ["international", "secrets", "software-dev"]
regex = '\bSG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}(?![A-Za-z0-9_-])'

[pattern.description]
en = "SendGrid API key: the literal SG., a twenty-two character key id, a dot, then a forty-three character secret. The prefix and the two fixed lengths keep noise negligible, and the lowercase form sg. is correctly left alone. No collision at the span level, though a digit run inside a key can trip de-phone on a sub-span."
fr = "Clé d'API SendGrid : le littéral SG., un identifiant de clé de vingt-deux caractères, un point, puis un secret de quarante-trois caractères. Le préfixe et les deux longueurs fixes rendent le bruit négligeable, et la forme minuscule sg. est correctement ignorée. Aucune collision au niveau du span, mais une suite de chiffres à l'intérieur d'une clé peut déclencher de-phone sur un sous-span."

# Clé inventée, longueurs exactes.
[[examples.match]]
text = "SENDGRID_API_KEY=SG.DEFGHIJKLMNOPQRSTUVWXY.FGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijkl"
value = "SG.DEFGHIJKLMNOPQRSTUVWXY.FGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijkl"

# Autre clé inventée.
[[examples.match]]
text = "La clé SG.LMNOPQRSTUVWXYZ0123456.RSTUVWXYZ0123456789abcdefghijklmnopqrstuvwx traînait dans le dépôt."
value = "SG.LMNOPQRSTUVWXYZ0123456.RSTUVWXYZ0123456789abcdefghijklmnopqrstuvwx"

# Segments trop courts.
[[examples.no_match]]
text = "SG.abc.def"

# La casse compte : sg. n'est pas SG.
[[examples.no_match]]
text = "sg.DEFGHIJKLMNOPQRSTUVWXY.FGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijkl"

[redos]
prefix = "SG."
filler = "A"
suffix = "!"
