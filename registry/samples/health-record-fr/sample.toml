schema_version = 1

[sample]
name = "health-record-fr"
title = { en = "Medical note (France)", fr = "Note médicale (France)" }
tags = ["fr", "lang-en", "healthcare", "document"]
text = """
CONSULTATION REPORT

Patient: Marie Lefevre, born 12/05/1985
NIR: 2 85 05 78 006 084 36
Address: 3 avenue du Parc, 69003 Lyon
Phone: 04 99 00 12 34
General practitioner: dr.martin@example.org

Reason for the consultation
---------------------------
Six-week follow-up after an operation carried out on 2 February. The patient
reports some discomfort left on exertion, no pain at rest, and a gradual
return to work over the past three weeks.

Examination
-----------
Clean scar, no sign of inflammation. Full mobility recovered. No complication
noted. The blood work of 28 February is within normal ranges and does not call
for an early review.

Plan
----
Rehabilitation continues at the current pace, two sessions a week. Sport under
load may resume in a month. Next appointment in six weeks, or sooner if pain
at rest comes back.

Report sent to the general practitioner at dr.martin@example.org and handed to
the patient in person.
"""

[[annotations]]
value = "Marie Lefevre"
label = "PERSON"

[[annotations]]
value = "2 85 05 78 006 084 36"
label = "FR_NIR"

[[annotations]]
value = "69003"
label = "FR_ZIP"

[[annotations]]
value = "04 99 00 12 34"
label = "FR_PHONE"

[[annotations]]
value = "dr.martin@example.org"
label = "EMAIL"
