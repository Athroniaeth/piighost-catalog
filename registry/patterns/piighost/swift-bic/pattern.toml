schema_version = 1

[pattern]
name = "swift-bic"
label = "SWIFT_BIC"
tags = ["international", "finance", "banking"]
regex = '(?<!\w)[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?(?!\w)'

[pattern.description]
en = "SWIFT business identifier code as ISO 9362 defines it: four letters of business party prefix, two letters of ISO 3166-1 country code, two alphanumerics of location code, then an optional three character branch code, so eight or eleven characters. The ISO TC68 note publishes ABCDBE22 as the code of a Belgian bank and ABCDBE22XYZ for a branch of the same party. Shape only, a BIC carries no check digit. The noise is ordinary capitals: any eight or eleven character run of upper case letters and digits fits, so shouted words, ticker lists and constant names in code all produce hits. Reproduced on the two ISO examples, no existing registry label fires alongside it."
fr = "Code d'identification bancaire SWIFT tel que le définit la norme ISO 9362 : quatre lettres de préfixe d'établissement, deux lettres de code pays ISO 3166-1, deux caractères alphanumériques de localisation, puis un code d'agence facultatif de trois caractères, soit huit ou onze caractères. La note ISO TC68 publie ABCDBE22 pour une banque belge et ABCDBE22XYZ pour une agence du même établissement. Forme seule, un BIC ne porte pas de clé de contrôle. Le bruit vient des capitales ordinaires : toute suite de huit ou onze majuscules et chiffres passe, donc les mots en capitales, les listes de tickers et les noms de constantes dans le code. Vérifié sur les deux exemples de l'ISO, aucun label existant du registre ne se déclenche en même temps."

[[examples.match]]
text = "The ISO note gives ABCDBE22 as the code of a Belgian bank."
value = "ABCDBE22"

[[examples.match]]
text = "A branch of the same party is reached at ABCDBE22XYZ on the network."
value = "ABCDBE22XYZ"

[[examples.no_match]]
text = "ABCDBE2"

[[examples.no_match]]
text = "abcdbe22"

[[examples.no_match]]
text = "ABCD BE 22"

[[examples.no_match]]
text = "ABCDBE22XY"

[redos]
prefix = ""
filler = "ABCDBE2"
suffix = "!"
