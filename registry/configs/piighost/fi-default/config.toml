schema_version = 1

[config]
name = "fi-default"
description = { en = "Finland without a model: phone and the personal identity code. No postal code: five bare digits are not safe beside a phone number, plus the European IBAN, BIC and VAT number, plus the email, URL, IPv4 and card number that belong to no country. Word-boundary expansion catches a value detected once everywhere else in the message.", fr = "Finlande sans modèle : téléphone et le code d'identité personnel. Pas de code postal : cinq chiffres nus ne sont pas sûrs à côté d'un téléphone, plus l'IBAN, le BIC et le numéro de TVA européens, plus l'e-mail, l'URL, l'IPv4 et le numéro de carte qui n'appartiennent à aucun pays. L'expansion par mot entier reprend partout dans le message une valeur détectée une fois." }
tags = ["chat", "customer-support", "document", "eu", "fi"]
piighost = ">=2.0,<3"

[[detectors]]
name = "regex-fi"
type = "regex"
groups = ["piighost/fi"]

[[detectors]]
name = "regex-eu"
type = "regex"
groups = ["piighost/eu-extended"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

[stages.linker]
type = "exact"

[stages.expander]
type = "word_boundary"

[stages.anonymizer.placeholder]
type = "label_counter"
