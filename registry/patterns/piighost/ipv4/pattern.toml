schema_version = 1

[pattern]
name = "ipv4"
title = { en = "IPv4 address", fr = "adresse IPv4" }
label = "IPV4"
tags = ["international", "network"]
regex = '(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)'

[pattern.description]
en = "Dotted-quad IPv4 address with each octet bounded to 0-255 and leading zeros refused. Refusing them is not cosmetic: a leading zero means octal to inet_aton and Python's ipaddress module rejects it, and allowing it made 01.99.00.12 an address, which stole the span of the dotted French phone number 01.99.00.12.34. This is the one place where the pattern departs from the one piighost 1.x shipped. No word boundaries, so it still fires on version strings such as 1.2.3.4."
fr = "Adresse IPv4 en notation pointée, chaque octet borné à 0-255 et les zéros en tête refusés. Les refuser n'est pas cosmétique : un zéro en tête signifie octal pour inet_aton et le module ipaddress de Python le rejette, et l'autoriser faisait de 01.99.00.12 une adresse, qui volait le span du numéro de téléphone français pointé 01.99.00.12.34. C'est le seul endroit où le motif s'écarte de celui que livrait piighost 1.x. Sans limite de mot, elle se déclenche toujours sur des numéros de version comme 1.2.3.4."


# Plages réservées à la documentation : 192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24.
[[examples.match]]
text = "Server at 192.0.2.10 is unreachable."
value = "192.0.2.10"

[[examples.match]]
text = "Blocked 203.0.113.254 after three failed logins."
value = "203.0.113.254"

# Trois groupes seulement.
[[examples.no_match]]
text = "version 1.2.3"

# Octets hors plage.
[[examples.no_match]]
text = "999.999.999.999"

# Zéro en tête : ce n'est pas une adresse canonique, c'est le début d'un
# numéro de téléphone français écrit avec des points.
[[examples.no_match]]
text = "01.99.00.12.34"

[redos]
prefix = "192.0.2.1 "
filler = "9999."
suffix = "x"
