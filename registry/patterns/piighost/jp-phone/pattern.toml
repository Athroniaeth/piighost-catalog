schema_version = 1

[pattern]
name = "jp-phone"
title = { en = "phone number (Japan)", fr = "numéro de téléphone (Japon)" }
label = "JP_PHONE"
tags = ["jp", "contact"]
regex = '(?<![\w+])(?:\+81|0)(?:[\s.-]?\d){9,10}(?!\w)'

[pattern.description]
en = "Japanese phone number, the +81 country code or the 0 trunk prefix then nine or ten digits. Japanese writing separates the area code, the exchange and the subscriber with dashes, and the separators are allowed anywhere between the digits."
fr = "Numéro de téléphone japonais, l'indicatif +81 ou le préfixe interurbain 0 puis neuf ou dix chiffres. L'écriture japonaise sépare l'indicatif, le central et l'abonné par des tirets, et les séparateurs sont acceptés partout entre les chiffres."

[[examples.match]]
text = "Please call +81 3 1234 5678 during office hours."
value = "+81 3 1234 5678"

[[examples.match]]
text = "My mobile is 090-1234-5678 if it is urgent."
value = "090-1234-5678"

[[examples.no_match]]
text = "The extension is 0123"

[[examples.no_match]]
text = "Order number 12345"

[redos]
prefix = "+81 "
filler = "3"
suffix = "x"
