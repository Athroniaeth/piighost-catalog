schema_version = 1

[pattern]
name = "us-phone"
title = { en = "phone number (US)", fr = "numéro de téléphone (États-Unis)" }
label = "US_PHONE"
tags = ["us", "contact"]
regex = '(?<![\w+])(?:\+?1[\s.-]?)?(?:\([2-9]\d{2}\)|[2-9]\d{2})[\s.-]?\d{3}[\s.-]?\d{4}(?!\d)'

[pattern.description]
en = "US phone number, optional +1 prefix and parentheses, then 3-3-4 digits. A lookbehind anchors before a leading + or (, which \\b would miss, and a lookahead stops a trailing digit run. The area-code parentheses are paired, so a number written inside parentheses does not swallow the opening one."
fr = "Numéro de téléphone américain, préfixe +1 et parenthèses optionnels, puis 3-3-4 chiffres. Un lookbehind ancre avant un + ou une ( initiale, que \\b raterait, et un lookahead coupe une suite de chiffres. Les parenthèses de l'indicatif sont appariées, donc un numéro écrit entre parenthèses n'avale pas la parenthèse ouvrante."


# 555-01xx est la plage réservée à la fiction (NANP), donc jamais attribuée.
[[examples.match]]
text = "Call +1 (415) 555-0123 before noon."
value = "+1 (415) 555-0123"

[[examples.match]]
text = "Office: 415-555-0123"
value = "415-555-0123"

[[examples.match]]
text = "Cell (415) 555-0123"
value = "(415) 555-0123"

# Indicatif commençant par 1 : impossible en NANP.
[[examples.no_match]]
text = "Call 115-555-0123 now"

# Trop court.
[[examples.no_match]]
text = "555-0123"

[redos]
prefix = "+1 (415) "
filler = "555-"
suffix = "x"
