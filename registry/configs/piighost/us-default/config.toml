schema_version = 1

[config]
name = "us-default"
description = { en = "the United States without a model: phone, ZIP code, the individual taxpayer number and the social security number, plus the email, URL, IPv4 and card number that belong to no country. Word-boundary expansion catches a value detected once everywhere else in the message.", fr = "États-Unis sans modèle : téléphone, code ZIP, le numéro fiscal individuel et le numéro de sécurité sociale, plus l'e-mail, l'URL, l'IPv4 et le numéro de carte qui n'appartiennent à aucun pays. L'expansion par mot entier reprend partout dans le message une valeur détectée une fois." }
tags = ["chat", "customer-support", "document", "us"]
piighost = ">=2.0,<3"

[[detectors]]
name = "regex-us"
type = "regex"
groups = ["piighost/us"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

[stages.linker]
type = "exact"

[stages.expander]
type = "word_boundary"

[stages.anonymizer.placeholder]
type = "label_counter"
