schema_version = 1

[pattern]
name = "fr-siren"
label = "FR_SIREN"
tags = ["fr", "business", "accounting", "finance"]
regex = '\b\d{3}[\s-]?\d{3}[\s-]?\d{3}\b(?![\s-]?\d)'

[pattern.description]
en = "French company identifier, nine digits in groups of three. The lookahead is what makes it composable: a SIRET is a SIREN followed by five more digits, and without it the shorter SIREN wins the shared start and shreds every SIRET. Declare fr-siret first all the same, so an establishment number is read as one."
fr = "Identifiant d'entreprise français, neuf chiffres en groupes de trois. Le lookahead le rend composable : un SIRET est un SIREN suivi de cinq chiffres de plus, et sans lui le SIREN, plus court, gagne le début commun et découpe chaque SIRET. Déclarez tout de même fr-siret en premier, pour qu'un numéro d'établissement soit lu d'un seul tenant."

# SIREN inventé, en groupes.
[[examples.match]]
text = "Le numéro SIREN 732 829 320 permet de retrouver la société sur l'annuaire."
value = "732 829 320"

# SIREN inventé, collé.
[[examples.match]]
text = "SIREN 552081317 pour la société mère."
value = "552081317"

# Un SIRET : les cinq chiffres de plus sont refusés par l'anticipation.
[[examples.no_match]]
text = "732 829 320 00074"

# Trop court.
[[examples.no_match]]
text = "12 345"

[redos]
prefix = '732 829 '
filler = '3'
suffix = 'x'
