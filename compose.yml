services:
  # The public entrypoint: serves the bundle and proxies /api to the API.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Inlined into the bundle by Vite, so it is set here and not below.
        # Empty means the site loads no analytics at all.
        VITE_OPENPANEL_CLIENT_ID: ${VITE_OPENPANEL_CLIENT_ID:-}
    # Injected into /api/ requests server-side, so the browser never sees it.
    # `:?` on purpose: a missing key must stop the deployment, not ship an open API.
    environment:
      API_KEY: ${API_KEY:?set API_KEY in .env (see .env.example)}
      # The host /api/op forwards events to, and the origin it presents to
      # OpenPanel's allow list. Only read when the template is rendered.
      OPENPANEL_HOST: ${OPENPANEL_HOST:-opapi.athroniaeth.cloud}
      SITE_URL: ${SITE_URL:-http://localhost:8000}
    ports:
      - "8000:8080"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      # Vertical scaling: one Granian worker per core is a sane starting point.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      # The same key the guard on /api/hello checks against.
      API_KEY: ${API_KEY:?set API_KEY in .env (see .env.example)}
      # Where the catalog registry lives inside the image. Override to serve a mirror.
      HUB_REGISTRY_DIR: ${HUB_REGISTRY_DIR:-/app/registry}
      # Target of the pull request link the contribution page builds.
      HUB_REGISTRY_REPO: ${HUB_REGISTRY_REPO:-Athroniaeth/piighost-catalog}
      HUB_REGISTRY_BRANCH: ${HUB_REGISTRY_BRANCH:-main}
      # Usage counters. A volume rather than the image, else a deployment
      # forgets how the catalog was used. See backend/hub/usage.py for what is in
      # it, which is deliberately not much.
      HUB_USAGE_DB: ${HUB_USAGE_DB:-/app/data/usage.db}
      # Where the API reports the calls a browser cannot report for itself:
      # the piighost library resolving a `catalog:` reference. All three or
      # none: see backend/hub/analytics.py. The secret stays here and never
      # reaches the bundle.
      OPENPANEL_API_URL: ${OPENPANEL_API_URL:-}
      OPENPANEL_CLIENT_ID: ${OPENPANEL_CLIENT_ID:-}
      OPENPANEL_CLIENT_SECRET: ${OPENPANEL_CLIENT_SECRET:-}
    volumes:
      - usage:/app/data
    # No `ports`: the API is reachable only by web, over the compose network.
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health")
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  usage:
