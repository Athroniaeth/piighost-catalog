schema_version = 1

[pattern]
name = "fr-maiden-name"
label = "FR_MAIDEN_NAME"
tags = ["fr", "identity", "legal", "notarial", "lang-fr"]
regex = "(?:(?<=née )|(?<=née )|(?<=né )|(?<=né ))[A-ZÀÂÄÇÉÈÊËÎÏÔÖÙÛÜŸŒÆ][a-zà-öø-ÿA-ZÀÂÄÇÉÈÊËÎÏÔÖÙÛÜŸŒÆ'’\\-]+(?:(?:[  ]+(?:de|du|des|la|le|van|von|den|der|di|da|ben|el|al))*[  ]+(?:d['’])?[A-ZÀÂÄÇÉÈÊËÎÏÔÖÙÛÜŸŒÆ][a-zà-öø-ÿA-ZÀÂÄÇÉÈÊËÎÏÔÖÙÛÜŸŒÆ'’\\-]+|,[  ]+[A-ZÀÂÄÇÉÈÊËÎÏÔÖÙÛÜŸŒÆ][a-zà-öø-ÿ][a-zà-öø-ÿ'’\\-]*(?=[  ]+[A-ZÀÂÄÇÉÈÊËÎÏÔÖÙÛÜŸŒÆ][a-zà-öø-ÿA-ZÀÂÄÇÉÈÊËÎÏÔÖÙÛÜŸŒÆ'’\\-]+))*"
resilience = false

[pattern.description]
en = "A maiden name after née or né. A NER model trained on ordinary prose rarely tags it, since the surname stands alone after a participle. It only matches after the formula that introduces it, so the value alone is not detected and the resilience check is off."
fr = "Un nom de naissance après née ou né. Un modèle NER entraîné sur de la prose ordinaire le relève rarement, car le nom se trouve seul après un participe. Il ne reconnaît la valeur qu'après la formule qui l'introduit, donc la valeur seule n'est pas détectée et le contrôle de résilience est désactivé."

# Exemples fictifs uniquement.

[[examples.match]]
text = "Madame Yvonne TANGUY, née MARTIN, retraitée."
value = "MARTIN"

[[examples.match]]
text = "Jeanne Dupuis née Le Goff le 3 mars 1950."
value = "Le Goff"

[[examples.no_match]]
text = "née le 3 mars 1950"

[[examples.no_match]]
text = "né à Brest"

[redos]
prefix = "née "
filler = "Ab "
suffix = "1"
