schema_version = 1

[config]
name = "sg-default"
description = { en = "Singapore without a model: phone and the NRIC or FIN identity number. No postal code: six bare digits are not safe beside a phone number, plus the email, URL, IPv4 and card number that belong to no country. Word-boundary expansion catches a value detected once everywhere else in the message.", fr = "Singapour sans modèle : téléphone et le numéro d'identité NRIC ou FIN. Pas de code postal : six chiffres nus ne sont pas sûrs à côté d'un téléphone, plus l'e-mail, l'URL, l'IPv4 et le numéro de carte qui n'appartiennent à aucun pays. L'expansion par mot entier reprend partout dans le message une valeur détectée une fois." }
tags = ["chat", "customer-support", "document", "sg"]
piighost = ">=1.7,<2"

[[detectors]]
name = "regex-sg"
type = "regex"
groups = ["piighost/sg"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

[stages.linker]
type = "exact"

[stages.expander]
type = "word_boundary"

[stages.anonymizer.placeholder]
type = "label_counter"
