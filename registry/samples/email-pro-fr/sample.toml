text = """
Subject: follow-up on file 732 829 320 00074 - direct debit rejected

Hello,

I am Patrick Dupont, a customer of yours since March 2019, and I am following
up after a first message that went unanswered last week.

The direct debit due on the 5th did not go through on my account
FR76 3000 6000 0112 3456 7890 189. My bank tells me the order was presented
and then rejected, for a reason it cannot detail to me. I received no notice
from your side, and this morning I found a late fee on my customer area.

My file is number 732 829 320 00074, under the company name. You can reach me
on 06 39 98 12 34 during the day, or by reply to patrick.dupont@example.com.
Afternoons are easier for me.

The billing address has not changed: 12 rue des Lilas, 75008 Paris. If you
need an up-to-date bank mandate or a statement from my bank, say so and I will
send them over the same day.

Please confirm the late fee is lifted once this is settled.

Kind regards,
Patrick Dupont
"""

