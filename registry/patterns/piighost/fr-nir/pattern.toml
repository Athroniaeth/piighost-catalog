schema_version = 1

[pattern]
name = "fr-nir"
title = { en = "NIR social security number (France)", fr = "numéro de sécurité sociale NIR (France)" }
label = "FR_NIR"
tags = ["fr", "government-id", "health", "healthcare", "hr"]
regex = '\b[12][\s.-]?\d{2}[\s.-]?(?:0[1-9]|1[0-2])[\s.-]?(?:2A|2B|\d{2})[\s.-]?\d{3}[\s.-]?\d{3}[\s.-]?\d{2}\b'

[pattern.description]
en = "French social security number (NIR): sex, year, month, department, commune, order, key. Shape only, no checksum, so an OCR-mangled value is still caught."
fr = "Numéro de sécurité sociale français (NIR) : sexe, année, mois, département, commune, ordre, clé. Forme seule, sans clé de contrôle, pour ne pas laisser passer une valeur abîmée par l'OCR."


[[examples.match]]
text = "NIR : 1 85 05 78 006 084 36."
value = "1 85 05 78 006 084 36"

[[examples.match]]
text = "Assuré n° 180057505600157"
value = "180057505600157"

[[examples.match]]
text = "Née en Corse : 2 90 12 2A 004 123 45"
value = "2 90 12 2A 004 123 45"

# Mois 13 : rejeté.
[[examples.no_match]]
text = "180137505600157"

# Quatorze chiffres : c'est un SIRET, pas un NIR.
[[examples.no_match]]
text = "SIRET 73282932000074"

[redos]
prefix = "1 85 01 "
filler = "75 "
suffix = "x"
