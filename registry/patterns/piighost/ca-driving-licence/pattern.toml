schema_version = 1

[pattern]
name = "ca-driving-licence"
label = "CA_DRIVING_LICENCE"
tags = ["ca", "government-id", "identity"]
regex = '(?<!\w)(?:[A-Z]\d{4}-?\d{5}-?\d[0156]\d[0-3]\d|[A-Z]\d{12}|[A-Z]{5}-?[0-3]\d[01]\d{6}|[A-Z]\d{9})(?!\w)'

[pattern.description]
en = "Canadian driver licence number, which varies by province. Four of the provincial layouts that Purview documents are covered, all of them letter led: Ontario, a letter, four digits, five digits and five more digits with two constrained positions, hyphens optional; Quebec, a letter and twelve digits; Nova Scotia, five letters and nine digits with a constrained head; Newfoundland and Labrador, a letter and nine digits. The purely numeric provinces, British Columbia at seven digits, Saskatchewan at eight and Alberta at five to nine, are left out because a bare digit run of that length is indistinguishable from any other number. Reproduced noise: inside the hyphenated Ontario form the five digit groups are separately matched by FR_ZIP, DE_ZIP, ES_POSTAL, IT_CAP and US_ZIP, and the nine digit tail of the Nova Scotia form is separately matched by NL_BSN and US_BANK_ROUTING."
fr = "Numéro de permis de conduire canadien, variable selon la province. Quatre des dispositions provinciales documentées par Purview sont couvertes, toutes commençant par une lettre : Ontario, une lettre, quatre chiffres, cinq chiffres puis cinq chiffres dont deux positions contraintes, traits d'union facultatifs ; Québec, une lettre et douze chiffres ; Nouvelle-Écosse, cinq lettres et neuf chiffres à tête contrainte ; Terre-Neuve-et-Labrador, une lettre et neuf chiffres. Les provinces purement numériques, Colombie-Britannique à sept chiffres, Saskatchewan à huit et Alberta de cinq à neuf, sont exclues : une suite de chiffres de cette longueur ne se distingue d'aucun autre nombre. Bruit reproduit : dans la forme ontarienne avec traits d'union, les groupes de cinq chiffres sont reconnus séparément par FR_ZIP, DE_ZIP, ES_POSTAL, IT_CAP et US_ZIP, et la queue de neuf chiffres de la forme néo-écossaise est reconnue séparément par NL_BSN et US_BANK_ROUTING."

[[examples.match]]
text = "Ontario prints A1234-56789-01234 across the front of the card."
value = "A1234-56789-01234"

[[examples.match]]
text = "The Quebec licence L123456789012 was renewed in June."
value = "L123456789012"

[[examples.match]]
text = "Nova Scotia issues SMITH-051234567 in that five letter layout."
value = "SMITH-051234567"

[[examples.no_match]]
text = "A1234-56789-07834"

[[examples.no_match]]
text = "12345-67890-12345"

[[examples.no_match]]
text = "a1234-56789-01234"

[redos]
prefix = ""
filler = "A1234-5678"
suffix = "!"
