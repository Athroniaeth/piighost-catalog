schema_version = 1

[pattern]
name = "fr-date"
label = "FR_DATE"
tags = ["fr", "identity", "legal", "notarial", "lang-fr"]
regex = "(?<!\\w)(?<!\\d du )(?<!\\d du )(?i:1er|[12]\\d|3[01]|0?[1-9])[   ]+(?i:janvier|f[eéÉ]vrier|mars|avril|mai|juin|juillet|ao[uûÛ]t|septembre|octobre|novembre|d[eéÉ]cembre)[   ]+(?:1[89]|20)\\d{2}(?!\\w)"

[pattern.description]
en = "A French date written with its month in letters, as a deed, a civil-status record or a medical report writes it: a day from 1er to 31, the month, a four-digit year from 1800 to 2099. A date of birth is a direct identifier that a NER model does not tag, and on its own this pattern cannot tell it from the date of the document, so it hides both. Capitals are matched, the no-break spaces of French typography too. A date spelt out in words (le douze mars) is not, nor the date of a legal text numbered before it (loi n° 89-462 du 6 juillet 1989), which designates no one."
fr = "Une date française écrite avec son mois en lettres, comme l'écrit un acte, un état civil ou un compte rendu médical : un jour de 1er à 31, le mois, une année à quatre chiffres de 1800 à 2099. Une date de naissance est un identifiant direct qu'un modèle NER ne relève pas, et ce motif seul ne la distingue pas de la date du document, donc il masque les deux. Les capitales sont reconnues, les espaces insécables de la typographie française aussi. Une date écrite en toutes lettres (le douze mars) ne l'est pas, ni la date d'un texte de loi numéroté juste avant (loi n° 89-462 du 6 juillet 1989), qui ne désigne personne."

# Dates fictives uniquement.
[[examples.match]]
text = "Monsieur Paul Martin, né le 12 mars 1985 à Rennes."
value = "12 mars 1985"

[[examples.match]]
text = "Née le 1er août 1962 à Quimper."
value = "1er août 1962"

[[examples.match]]
text = "FAIT ET PASSÉ LE 3 FÉVRIER 2024"
value = "3 FÉVRIER 2024"

# Espaces insécables, comme les pose la typographie française.
[[examples.match]]
text = "Signé le 14 juillet 2023 à Paris."
value = "14 juillet 2023"

# Jour 32 : refusé.
[[examples.no_match]]
text = "le 32 mars 1985"

# Un mot qui commence comme un mois n'en est pas un.
[[examples.no_match]]
text = "12 marsupiaux 1985"

# Une référence d'article n'est pas une date.
[[examples.no_match]]
text = "article 1583 du Code civil"

# La date d'un texte de loi reste lisible : elle ne désigne personne.
[[examples.no_match]]
text = "en application de la loi n° 89-462 du 6 juillet 1989"

[redos]
prefix = "12 mars "
filler = "1 "
suffix = "x"
