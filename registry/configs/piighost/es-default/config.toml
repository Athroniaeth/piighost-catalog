schema_version = 1

[config]
name = "es-default"
title = { en = "Spain, regex only", fr = "Espagne, regex seules" }
description = { en = "Spain without a model: phone, postal code, the DNI and NIE identity numbers and the CIF company tax number, plus the European IBAN and VAT number, plus the email, URL, IPv4 and card number that belong to no country. Word-boundary expansion catches a value detected once everywhere else in the message.", fr = "Espagne sans modèle : téléphone, code postal, les numéros d'identité DNI et NIE et le numéro fiscal d'entreprise CIF, plus l'IBAN et le numéro de TVA européens, plus l'e-mail, l'URL, l'IPv4 et le numéro de carte qui n'appartiennent à aucun pays. L'expansion par mot entier reprend partout dans le message une valeur détectée une fois." }
tags = ["chat", "customer-support", "document", "es", "eu"]
piighost = ">=2.0,<3"

[[detectors]]
name = "regex-es"
type = "regex"
groups = ["piighost/es"]

[[detectors]]
name = "regex-eu"
type = "regex"
groups = ["piighost/eu-extended"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

[stages.linker]
type = "exact"

[stages.expander]
type = "word_boundary"

[stages.anonymizer.placeholder]
type = "label_counter"
