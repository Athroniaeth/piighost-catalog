schema_version = 1

[pattern]
name = "cl-phone"
label = "CL_PHONE"
tags = ["cl", "contact"]
regex = '(?<![\w+])\+56(?:[\s.-]?\d){8,9}(?!\w)'

[pattern.description]
en = "Chilean phone number. The +56 country code is required rather than optional, because a Chilean number written without it is nine bare digits, a shape that several other identifiers in the catalog already claim."
fr = "Numéro de téléphone chilien. L'indicatif +56 est exigé plutôt qu'optionnel, car un numéro chilien écrit sans lui se réduit à neuf chiffres nus, une forme que plusieurs autres identifiants du catalogue revendiquent déjà."

[[examples.match]]
text = "Escríbeme al +56 9 6123 4567 por WhatsApp."
value = "+56 9 6123 4567"

[[examples.match]]
text = "La central atiende en +56 2 2345 6789."
value = "+56 2 2345 6789"

[[examples.no_match]]
text = "El anexo es 9 6123"

[[examples.no_match]]
text = "Marca 961234567 desde Chile"

[redos]
prefix = "+56 "
filler = "9"
suffix = "x"
