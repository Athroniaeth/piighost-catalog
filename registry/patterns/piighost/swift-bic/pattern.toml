schema_version = 1

[pattern]
name = "swift-bic"
label = "SWIFT_BIC"
tags = ["international", "finance", "banking"]
regex = "(?:(?:(?<=BIC )|(?<=BIC: )|(?<=BIC : )|(?<=BIC : )|(?<=BIC: )|(?<=BIC : )|(?<=BIC : )|(?<=SWIFT )|(?<=SWIFT: )|(?<=SWIFT : )|(?<=SWIFT : )|(?<=SWIFT: )|(?<=SWIFT : )|(?<=SWIFT : )|(?<=BIC/SWIFT )|(?<=BIC/SWIFT: )|(?<=BIC/SWIFT : )|(?<=BIC/SWIFT : )|(?<=BIC/SWIFT: )|(?<=BIC/SWIFT : )|(?<=BIC/SWIFT : )|(?<=SWIFT/BIC )|(?<=SWIFT/BIC: )|(?<=SWIFT/BIC : )|(?<=SWIFT/BIC : )|(?<=SWIFT/BIC: )|(?<=SWIFT/BIC : )|(?<=SWIFT/BIC : )|(?<=Code\\ BIC )|(?<=Code\\ BIC: )|(?<=Code\\ BIC : )|(?<=Code\\ BIC : )|(?<=Code\\ BIC: )|(?<=Code\\ BIC : )|(?<=Code\\ BIC : )|(?<=code\\ BIC )|(?<=code\\ BIC: )|(?<=code\\ BIC : )|(?<=code\\ BIC : )|(?<=code\\ BIC: )|(?<=code\\ BIC : )|(?<=code\\ BIC : )|(?<=SWIFT\\ BIC )|(?<=SWIFT\\ BIC: )|(?<=SWIFT\\ BIC : )|(?<=SWIFT\\ BIC : )|(?<=SWIFT\\ BIC: )|(?<=SWIFT\\ BIC : )|(?<=SWIFT\\ BIC : )|(?<=SWIFT\\ BIC\\ Code )|(?<=SWIFT\\ BIC\\ Code: )|(?<=SWIFT\\ BIC\\ Code : )|(?<=SWIFT\\ BIC\\ Code : )|(?<=SWIFT\\ BIC\\ Code: )|(?<=SWIFT\\ BIC\\ Code : )|(?<=SWIFT\\ BIC\\ Code : )|(?<=code\\ SWIFT )|(?<=code\\ SWIFT: )|(?<=code\\ SWIFT : )|(?<=code\\ SWIFT : )|(?<=code\\ SWIFT: )|(?<=code\\ SWIFT : )|(?<=code\\ SWIFT : )|(?<=Code\\ SWIFT )|(?<=Code\\ SWIFT: )|(?<=Code\\ SWIFT : )|(?<=Code\\ SWIFT : )|(?<=Code\\ SWIFT: )|(?<=Code\\ SWIFT : )|(?<=Code\\ SWIFT : )|(?<=code\\ SWIFT\\ est )|(?<=code\\ SWIFT\\ est: )|(?<=code\\ SWIFT\\ est : )|(?<=code\\ SWIFT\\ est : )|(?<=code\\ SWIFT\\ est: )|(?<=code\\ SWIFT\\ est : )|(?<=code\\ SWIFT\\ est : )|(?<=SWIFT\\ BIC\\ est )|(?<=SWIFT\\ BIC\\ est: )|(?<=SWIFT\\ BIC\\ est : )|(?<=SWIFT\\ BIC\\ est : )|(?<=SWIFT\\ BIC\\ est: )|(?<=SWIFT\\ BIC\\ est : )|(?<=SWIFT\\ BIC\\ est : )|(?<=BIC\\ est )|(?<=BIC\\ est: )|(?<=BIC\\ est : )|(?<=BIC\\ est : )|(?<=BIC\\ est: )|(?<=BIC\\ est : )|(?<=BIC\\ est : )|(?<=swiftBIC> )|(?<=swiftBIC>: )|(?<=swiftBIC> : )|(?<=swiftBIC> : )|(?<=swiftBIC>: )|(?<=swiftBIC> : )|(?<=swiftBIC> : )|(?<=swiftBIC>)|(?<=bic> )|(?<=bic>: )|(?<=bic> : )|(?<=bic> : )|(?<=bic>: )|(?<=bic> : )|(?<=bic> : )|(?<=bic>)|(?<=BIC> )|(?<=BIC>: )|(?<=BIC> : )|(?<=BIC> : )|(?<=BIC>: )|(?<=BIC> : )|(?<=BIC> : )|(?<=BIC>)|(?<=SWIFT> )|(?<=SWIFT>: )|(?<=SWIFT> : )|(?<=SWIFT> : )|(?<=SWIFT>: )|(?<=SWIFT> : )|(?<=SWIFT> : )|(?<=SWIFT>))[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?(?!\\w)|(?<!\\w)(?=[A-Z]{6}[A-Z0-9]{0,4}\\d)[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?(?!\\w))"
resilience = false

[pattern.description]
en = "SWIFT business identifier code as ISO 9362 defines it: four letters of business party prefix, two letters of ISO 3166-1 country code, two alphanumerics of location code, then an optional three-character branch code, so eight or eleven characters. It is matched after a keyword (BIC, SWIFT, SWIFT BIC Code, code SWIFT est, an XML tag such as swiftBIC), or anywhere when it carries a digit. An all-letter run with no keyword is left alone: the bare shape is any eight or eleven capitals, so it masked headings in capitals (DESIGNATION, PAIEMENT), ticker lists and constant names, 659 times on a benchmark of French deeds and never a BIC. An all-letter code given without its keyword is missed, which costs little, since a BIC designates a bank branch, not a person. The ISO TC68 note publishes ABCDBE22 for a Belgian bank and ABCDBE22XYZ for a branch of the same party. The value alone is not always detected, so the resilience check is off."
fr = "Code d'identification bancaire SWIFT tel que le définit la norme ISO 9362 : quatre lettres de préfixe d'établissement, deux lettres de code pays ISO 3166-1, deux caractères alphanumériques de localisation, puis un code d'agence facultatif de trois caractères, soit huit ou onze caractères. Il est reconnu après un mot-clé (BIC, SWIFT, SWIFT BIC Code, code SWIFT est, une balise XML comme swiftBIC), ou partout quand il contient un chiffre. Une suite de lettres seules sans mot-clé est laissée : la forme seule est n'importe quelle suite de huit ou onze capitales, donc elle masquait les titres en capitales (DESIGNATION, PAIEMENT), les listes de tickers et les noms de constantes, 659 fois sur un banc d'essai d'actes français et jamais un BIC. Un code en lettres seules donné sans son mot-clé est manqué, ce qui coûte peu, car un BIC désigne une agence bancaire, pas une personne. La note ISO TC68 publie ABCDBE22 pour une banque belge et ABCDBE22XYZ pour une agence du même établissement. La valeur seule n'est pas toujours détectée, donc le contrôle de résilience est désactivé."

# Les deux codes de la note ISO TC68, après leur mot-clé.
[[examples.match]]
text = "IBAN BE71 0961 2345 6769, BIC : ABCDBE22."
value = "ABCDBE22"

[[examples.match]]
text = "Virement par SWIFT ABCDBE22XYZ vers l'agence."
value = "ABCDBE22XYZ"

# Un titre en capitales n'est pas un code bancaire.
[[examples.no_match]]
text = "DESIGNATION DU BIEN"

# Un code qui contient un chiffre est reconnu même sans mot-clé.
[[examples.match]]
text = "Code de la banque : REIUUSJL577, agence de Boston."
value = "REIUUSJL577"

# Sans le mot-clé, une suite de lettres seules ne suffit plus.
[[examples.no_match]]
text = "BNPAFRPP"

[[examples.no_match]]
text = "BIC : ABCDBE2"

[[examples.no_match]]
text = "BIC : ABCDBE22XY"

[redos]
prefix = "BIC "
filler = "ABCDBE2"
suffix = "!"
