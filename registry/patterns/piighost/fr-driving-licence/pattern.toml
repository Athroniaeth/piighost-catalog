schema_version = 1

[pattern]
name = "fr-driving-licence"
label = "FR_DRIVING_LICENCE"
tags = ["fr", "government-id", "identity"]
regex = '(?<!\w)\d{12}(?!\w)'

[pattern.description]
en = "French driving licence file number, the numero NEPH: twelve digits, printed on the back of the credit card format licence in two groups of six. Microsoft Purview defines the France driver licence entity as twelve digits with no checksum, and the ANTS pages describe the same twelve digit NEPH. Twelve bare digits is a weak shape and it needs context words to be worth anything. Reproduced collisions: a NEPH that starts with a zero is also matched whole by DE_PHONE and by IT_PHONE, since both accept a leading zero trunk code. Twelve digits stays under the CREDIT_CARD window of thirteen to nineteen digits and over PL_PESEL and IT_PARTITA_IVA at eleven, so those three do not fire."
fr = "Numéro de dossier du permis de conduire français, le numéro NEPH : douze chiffres, imprimés au dos du permis au format carte bancaire en deux groupes de six. Microsoft Purview définit l'entité permis français comme douze chiffres sans somme de contrôle, et les pages de l'ANTS décrivent le même NEPH à douze chiffres. Douze chiffres nus restent une forme faible qui demande des mots de contexte. Collisions reproduites : un NEPH commençant par zéro est aussi reconnu en entier par DE_PHONE et par IT_PHONE, qui acceptent tous deux un zéro initial. Douze chiffres reste sous la fenêtre de CREDIT_CARD, de treize à dix-neuf chiffres, et au-dessus de PL_PESEL et IT_PARTITA_IVA à onze, donc ces trois labels ne se déclenchent pas."

[[examples.match]]
text = "The NEPH on the back of the licence reads 123456789012 in two groups of six."
value = "123456789012"

[[examples.match]]
text = "Dossier 051234567890 was opened at the prefecture last spring."
value = "051234567890"

[[examples.no_match]]
text = "12345678901"

[[examples.no_match]]
text = "1234567890123"

[[examples.no_match]]
text = "0512 3456 7890"

[redos]
prefix = ""
filler = "1"
suffix = "x"
