schema_version = 1

[pattern]
name = "pt-nif"
title = { en = "NIF tax number (Portugal)", fr = "numéro fiscal NIF (Portugal)" }
label = "PT_NIF"
tags = ["pt", "government-id", "accounting"]
regex = '(?<!\w)\d{3} ?\d{3} ?\d{3}(?!\w)'

[pattern.description]
en = "Portuguese tax identification number, the NIF or numero de contribuinte: nine digits, written solid or in three groups of three, per the Purview Portugal tax identification definition; Cloudflare publishes 100000002 as its sample. The checksum is not verified. Reproduced collisions: written solid the value is matched whole by US_BANK_ROUTING, by NL_BSN and by PL_PHONE, and written with spaces it is matched whole by CA_SIN and by PL_PHONE. This is a keyword dependent label, the shape alone decides nothing."
fr = "Numéro d'identification fiscale portugais, le NIF ou numéro de contribuinte : neuf chiffres, écrits d'un bloc ou en trois groupes de trois, selon la définition Purview du numéro fiscal portugais ; Cloudflare publie 100000002 comme exemple. La somme de contrôle n'est pas vérifiée. Collisions reproduites : écrite d'un bloc, la valeur est reconnue en entier par US_BANK_ROUTING, par NL_BSN et par PL_PHONE, et écrite avec des espaces elle est reconnue en entier par CA_SIN et par PL_PHONE. Ce label dépend des mots-clés, la forme seule ne tranche rien."

[[examples.match]]
text = "O NIF 123456789 consta da factura."
value = "123456789"

[[examples.match]]
text = "The tax number 245 678 902 is printed in three groups."
value = "245 678 902"

[[examples.no_match]]
text = "12345678"

[[examples.no_match]]
text = "1234567890"

[[examples.no_match]]
text = "123-456-789"

[redos]
prefix = ""
filler = "123 45"
suffix = "x"
