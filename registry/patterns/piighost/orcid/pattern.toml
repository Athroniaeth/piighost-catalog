schema_version = 1

[pattern]
name = "orcid"
title = { en = "ORCID iD", fr = "identifiant ORCID" }
label = "ORCID"
tags = ["international", "identity"]
regex = '(?<!\w)0000-000[1-3]-\d{4}-\d{3}[0-9X](?!\w)'

[pattern.description]
en = "ORCID researcher identifier, sixteen digits in four dashed groups with a final checksum that can be an X. Every ORCID issued so far starts 0000-0001, 0000-0002 or 0000-0003, which is what makes it safe to detect. It identifies a named person and appears in papers, grant files and academic mailing lists."
fr = "Identifiant de chercheur ORCID, seize chiffres en quatre groupes séparés par des tirets, avec une clé finale qui peut être un X. Tous les ORCID délivrés à ce jour commencent par 0000-0001, 0000-0002 ou 0000-0003, ce qui rend sa détection sûre. Il désigne une personne nommée et apparaît dans les articles, les dossiers de financement et les listes de diffusion académiques."

[[examples.match]]
text = "The author is 0000-0002-1825-0097 on the paper."
value = "0000-0002-1825-0097"

[[examples.match]]
text = "Cite 0000-0001-5109-3700 as the corresponding author."
value = "0000-0001-5109-3700"

[[examples.no_match]]
text = "The code 0000-0009-1825-0097 is out of range"

[[examples.no_match]]
text = "Reference 0000-0002-1825"

[redos]
prefix = "0000-0002"
filler = "-1825"
suffix = "x"
