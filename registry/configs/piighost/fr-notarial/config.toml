schema_version = 1

[config]
name = "fr-notarial"
description = { en = "French deeds and client files: the French and European shapes, plus every date, since a date of birth is a direct identifier no model tags, the formulae that introduce a party, an address or a cadastral reference, and a local model for the names, addresses and firms an act is full of. Fuzzy entity resolution groups a name spelled two ways onto one token, and word-boundary expansion catches a value that appears again further down.", fr = "Actes et dossiers clients français : les formes françaises et européennes, plus toutes les dates, car une date de naissance est un identifiant direct qu'aucun modèle ne relève, les formules qui introduisent une partie, une adresse ou une référence cadastrale, et un modèle local pour les noms, adresses et études dont un acte est rempli. La résolution floue regroupe un nom orthographié de deux façons sur un seul jeton, et l'expansion par mot entier rattrape une valeur qui réapparaît plus bas." }
tags = ["fr", "eu", "lang-fr", "notarial", "legal", "document", "identity"]
piighost = ">=2.0,<3"

[[extends]]
ref = "piighost/fr-default"

# Dates of birth are direct identifiers the model does not tag, and a pattern
# cannot tell them from other dates, so a deed has all its dates hidden.
[[detectors]]
name = "regex-fr-dates"
type = "regex"
groups = ["piighost/fr-dates"]

# The formulae of a deed catch the names and addresses the model misses, and
# the cadastral references it has no label for.
[[detectors]]
name = "regex-fr-deeds"
type = "regex"
groups = ["piighost/fr-deeds"]

[[detectors]]
name = "ner"
type = "gliner2"
model = "fastino/gliner2-multi-v1"
labels = ["PERSON", "ADDRESS", "ORGANIZATION"]
threshold = 0.5
# A deed runs to tens of pages. Chunked at 1,000 characters the model reads all
# of it, where the whole text in one pass lost 13 points of recall and, past
# 13,000 characters, exhausted memory.
max_chars = 1000

# Rules and the model overlap on names and addresses. Keeping the surer one
# let a short rule span uncover the rest of the model's, so the union is kept.
[stages.overlap_resolver]
type = "merge"

[stages.entity_resolver]
type = "fuzzy"
threshold = 0.85
