schema_version = 1

[pattern]
name = "in-phone"
title = { en = "mobile number (India)", fr = "numéro de mobile (Inde)" }
label = "IN_PHONE"
tags = ["in", "contact"]
regex = '(?<![\w+])(?:\+91[\s.-]?)?[6-9]\d{4}[\s.-]?\d{5}(?!\w)'

[pattern.description]
en = "Indian mobile number: an optional +91, then ten digits starting 6, 7, 8 or 9, the range the regulator allocates to mobiles. Ten bare digits also match, so it competes with the NHS number and the US provider identifier."
fr = "Numéro de mobile indien : un +91 optionnel, puis dix chiffres commençant par 6, 7, 8 ou 9, la plage que le régulateur attribue aux mobiles. Dix chiffres nus correspondent aussi, donc il entre en concurrence avec le numéro NHS et l'identifiant de praticien américain."

[[examples.match]]
text = "Call +91 98765 43210 after lunch."
value = "+91 98765 43210"

[[examples.match]]
text = "Mobile 9876543210 on the form."
value = "9876543210"

[[examples.no_match]]
text = "Call 5876543210"

[[examples.no_match]]
text = "Call 98765 4321"

[redos]
prefix = "+91 "
filler = "98"
suffix = "x"
