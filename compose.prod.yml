# Production stack for Coolify. Differs from compose.yml on three points, all of them
# consequences of running behind Coolify's Traefik rather than on a laptop:
#
#   - No `ports:`. Publishing a port bypasses the proxy entirely and would expose the
#     container straight to the host. Traefik reaches `web` over the project network,
#     so nothing needs publishing.
#   - SERVICE_FQDN_WEB_8080 asks Coolify to generate a domain, attach it to this
#     service and route it to port 8080 (nginx runs unprivileged, hence not 80).
#   - `restart: unless-stopped`, so a crashed container comes back on its own.
#
# `api` gets no domain and no published port: Coolify keeps such services private to
# the project network, reachable only as `http://api:8000` — which is exactly what
# nginx does. Give it a domain only if you decide to open the API to third parties,
# and read the API key section of the README first.
#
# Coolify treats this file as the source of truth: declare things here, not in the UI.
#
# `environment` is a mapping, not a list. Coolify re-serializes the file before
# handing it to compose, and it turns a list into a mapping by splitting each
# entry on `=`. SERVICE_FQDN_WEB_8080 carries no `=`, so it came back keyed by
# its index and compose refused the file: "non-string key in
# services.web.environment: 0". A mapping has nothing to infer.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Inlined into the bundle by Vite, so it is a build argument. Empty
        # means the site loads no analytics at all.
        VITE_OPENPANEL_CLIENT_ID: ${VITE_OPENPANEL_CLIENT_ID:-6b28f138-22a9-4dca-aa30-20d96f67435c}
    environment:
      # Magic variable, intentionally valueless: Coolify fills it in.
      SERVICE_FQDN_WEB_8080: ""
      # `:?` makes it a required variable in the UI — a blank value blocks the
      # deployment instead of shipping an API with an empty key to compare against.
      API_KEY: ${API_KEY:?}
      # Where the catalog registry lives inside the image. Override to serve a mirror.
      HUB_REGISTRY_DIR: ${HUB_REGISTRY_DIR:-/app/registry}
      # Target of the pull request link the contribution page builds.
      HUB_REGISTRY_REPO: ${HUB_REGISTRY_REPO:-Athroniaeth/piighost-catalog}
      HUB_REGISTRY_BRANCH: ${HUB_REGISTRY_BRANCH:-main}
      # The host /api/op forwards events to, and the origin nginx presents to
      # OpenPanel's allow list. Read once, when the template is rendered.
      OPENPANEL_HOST: ${OPENPANEL_HOST:-opapi.athroniaeth.cloud}
      SITE_URL: ${SITE_URL:-https://catalog.piighost.dev}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      # Vertical scaling knob: one Granian worker per core is a sane start.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      # Docs off by default here: /schema publishes a full route inventory, and the
      # API has its own public domain on Coolify, so nginx cannot hide them. Set
      # ENABLE_DOCS=true in the project variables to turn them back on temporarily.
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      API_KEY: ${API_KEY:?}
      # Where the catalog registry lives inside the image. Override to serve a mirror.
      HUB_REGISTRY_DIR: ${HUB_REGISTRY_DIR:-/app/registry}
      # Target of the pull request link the contribution page builds.
      HUB_REGISTRY_REPO: ${HUB_REGISTRY_REPO:-Athroniaeth/piighost-catalog}
      HUB_REGISTRY_BRANCH: ${HUB_REGISTRY_BRANCH:-main}
      # Usage counters. A volume rather than the image, else a deployment
      # forgets how the catalog was used.
      HUB_USAGE_DB: ${HUB_USAGE_DB:-/app/data/usage.db}
      # Where the API reports what a browser cannot report for itself. All three
      # or none; the secret never reaches the bundle. See hub/analytics.py.
      OPENPANEL_API_URL: ${OPENPANEL_API_URL:-}
      OPENPANEL_CLIENT_ID: ${OPENPANEL_CLIENT_ID:-6b28f138-22a9-4dca-aa30-20d96f67435c}
      OPENPANEL_CLIENT_SECRET: ${OPENPANEL_CLIENT_SECRET:-}
    volumes:
      - usage:/app/data
    healthcheck:
      # No curl in the image; the venv's python is on PATH. /api/health is public on
      # purpose, since this check bypasses nginx and therefore carries no key.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health")
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  usage:
