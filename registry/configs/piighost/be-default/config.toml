schema_version = 1

[config]
name = "be-default"
description = { en = "Belgium without a model: phone and the national register number, plus the European IBAN, BIC and VAT number, plus the email, URL, IPv4 and card number that belong to no country. Word-boundary expansion catches a value detected once everywhere else in the message.", fr = "Belgique sans modèle : téléphone et le numéro de registre national, plus l'IBAN, le BIC et le numéro de TVA européens, plus l'e-mail, l'URL, l'IPv4 et le numéro de carte qui n'appartiennent à aucun pays. L'expansion par mot entier reprend partout dans le message une valeur détectée une fois." }
tags = ["be", "chat", "customer-support", "document", "eu"]
piighost = ">=1.7,<2"

[[detectors]]
name = "regex-be"
type = "regex"
groups = ["piighost/be"]

[[detectors]]
name = "regex-eu"
type = "regex"
groups = ["piighost/eu-extended"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

[stages.linker]
type = "exact"

[stages.expander]
type = "word_boundary"

[stages.anonymizer.placeholder]
type = "label_counter"
