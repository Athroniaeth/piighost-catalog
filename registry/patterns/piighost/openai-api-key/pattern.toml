schema_version = 1

[pattern]
name = "openai-api-key"
title = { en = "OpenAI API key", fr = "clé d'API OpenAI" }
label = "OPENAI_API_KEY"
tags = ["international", "secrets", "software-dev"]
regex = '(?<![A-Za-z0-9])sk-(?!ant-)(?:proj-)?[A-Za-z0-9_-]{20,}'

[pattern.description]
en = "OpenAI secret key, the sk- prefix with the optional proj- segment, then at least twenty key characters. Anthropic keys start sk-ant- and are excluded here, otherwise every one of them is reported as an OpenAI key. Not a personal identifier but a credential, which is exactly what must not reach a third-party model when a developer pastes a config or a traceback."
fr = "Clé secrète OpenAI, le préfixe sk- avec le segment proj- optionnel, puis au moins vingt caractères de clé. Les clés Anthropic commencent par sk-ant- et sont exclues ici, sans quoi chacune d'elles serait signalée comme une clé OpenAI. Ce n'est pas une donnée personnelle mais un secret, et c'est précisément ce qui ne doit pas atteindre un modèle tiers quand un développeur colle une configuration ou une trace d'erreur."

# Clés inventées, de la bonne forme, jamais émises.
[[examples.match]]
text = "export OPENAI_API_KEY=sk-proj-abcdefghijklmnopqrstuvwxyz0123456789ABCD"
value = "sk-proj-abcdefghijklmnopqrstuvwxyz0123456789ABCD"

[[examples.match]]
text = "Key sk-abcdefghijklmnopqrstuvwxyz012345 rejected."
value = "sk-abcdefghijklmnopqrstuvwxyz012345"

# Trop court pour être une clé.
[[examples.no_match]]
text = "sk-abc123"

# Collé à un mot : ce n'est pas un début de clé.
[[examples.no_match]]
text = "risk-abcdefghijklmnopqrstuvwxyz012345"

# Une clé Anthropic : elle a son propre motif, et sans cette exclusion elle
# serait entièrement reconnue comme une clé OpenAI.
[[examples.no_match]]
text = "sk-ant-api03-abcdefghijklmnopqrstuvwxyz0123456789"

[redos]
prefix = "sk-proj-"
filler = "a"
suffix = " "
