schema_version = 1

[pattern]
name = "br-cep"
title = { en = "CEP postal code (Brazil)", fr = "code postal CEP (Brésil)" }
label = "BR_CEP"
tags = ["br", "location", "contact"]
regex = '(?<!\d)\d{5}-\d{3}(?!\d)'

[pattern.description]
en = "Brazilian postal code (CEP), five digits, a hyphen, then three. The hyphen makes it distinctive: unlike the five-digit European codes it does not collide with anything else in the catalog."
fr = "Code postal brésilien (CEP), cinq chiffres, un tiret, puis trois. Le tiret le rend distinctif : contrairement aux codes européens à cinq chiffres, il n'entre en collision avec rien d'autre dans le catalogue."

[[examples.match]]
text = "Avenida Paulista, 01310-100 em Sao Paulo."
value = "01310-100"

[[examples.match]]
text = "CEP 20040-020 no Rio de Janeiro."
value = "20040-020"

[[examples.no_match]]
text = "CEP 01310100"

[[examples.no_match]]
text = "CEP 0131-100"

[redos]
prefix = ""
filler = "01310-"
suffix = "x"
