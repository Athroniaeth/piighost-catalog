schema_version = 1

[config]
name = "jp-default"
description = { en = "Japan without a model: phone, postal code and the My Number individual identifier, plus the email, URL, IPv4 and card number that belong to no country. Word-boundary expansion catches a value detected once everywhere else in the message.", fr = "Japon sans modèle : téléphone, code postal et l'identifiant individuel My Number, plus l'e-mail, l'URL, l'IPv4 et le numéro de carte qui n'appartiennent à aucun pays. L'expansion par mot entier reprend partout dans le message une valeur détectée une fois." }
tags = ["chat", "customer-support", "document", "jp"]
piighost = ">=1.7,<2"

[[detectors]]
name = "regex-jp"
type = "regex"
groups = ["piighost/jp"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

[stages.linker]
type = "exact"

[stages.expander]
type = "word_boundary"

[stages.anonymizer.placeholder]
type = "label_counter"
