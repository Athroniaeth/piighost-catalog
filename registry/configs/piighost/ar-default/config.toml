schema_version = 1

[config]
name = "ar-default"
description = { en = "Argentina without a model: phone, CPA postal code and the DNI identity number, plus the email, URL, IPv4 and card number that belong to no country. Word-boundary expansion catches a value detected once everywhere else in the message.", fr = "Argentine sans modèle : téléphone, code postal CPA et le numéro d'identité DNI, plus l'e-mail, l'URL, l'IPv4 et le numéro de carte qui n'appartiennent à aucun pays. L'expansion par mot entier reprend partout dans le message une valeur détectée une fois." }
tags = ["ar", "chat", "customer-support", "document"]
piighost = ">=1.7,<2"

[[detectors]]
name = "regex-ar"
type = "regex"
groups = ["piighost/ar"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

[stages.linker]
type = "exact"

[stages.expander]
type = "word_boundary"

[stages.anonymizer.placeholder]
type = "label_counter"
