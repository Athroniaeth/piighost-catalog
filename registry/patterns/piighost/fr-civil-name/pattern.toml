resilience = false

[pattern.description]
en = "A person's name after a civility, the way a deed, a lease or a medical report introduces a party: Monsieur, Madame, Mademoiselle, Mme, Mlle, M., Dr, Docteur, Pr. The name runs over capitalised words, particles (de, du, de la, van) and several first names separated by commas, as civil status writes them. An M. right after a capitalised word is a middle initial (Loni M. Wirth), not a civility, and starts nothing. The civility stays, so the text still reads. It only matches after the formula that introduces it, so the value alone is not detected and the resilience check is off."
fr = "Le nom d'une personne après une civilité, comme un acte, un bail ou un compte rendu médical présente une partie : Monsieur, Madame, Mademoiselle, Mme, Mlle, M., Dr, Docteur, Pr. Le nom court sur les mots à capitale, les particules (de, du, de la, van) et plusieurs prénoms séparés par des virgules, comme les écrit l'état civil. Un M. juste après un mot à capitale est une initiale (Loni M. Wirth), pas une civilité, et ne déclenche rien. La civilité reste, donc le texte se lit encore. Il ne reconnaît la valeur qu'après la formule qui l'introduit, donc la valeur seule n'est pas détectée et le contrôle de résilience est désactivé."

# Exemples fictifs uniquement.

[[examples.match]]
text = "Entre Monsieur Paul LEMOINE, demeurant à Rennes."
value = "Paul LEMOINE"

[[examples.match]]
text = "Et Madame Juliette, Béatrice JULIEN, son épouse."
value = "Juliette, Béatrice JULIEN"

[[examples.match]]
text = "Reçu par Mme Anne-Sophie de La Tour hier."
value = "Anne-Sophie de La Tour"

[[examples.match]]
text = "Vu par le Dr Manon Jaouen ce matin."
value = "Manon Jaouen"

[[examples.no_match]]
text = "Monsieur le Maire a signé."

[[examples.no_match]]
text = "Madame, nous accusons réception."

[[examples.no_match]]
text = "Signé Loni M. Wirth."

[redos]
prefix = "Monsieur "
filler = "Ab "
suffix = "1"
