schema_version = 1

[config]
name = "regex-default"
description = { en = "Regex only, no model, no network: the generic, French, European and secret groups, France first so a SIRET or a NIR is not taken for a card number. The default of piighost-api.", fr = "Regex seul, sans modèle ni réseau : les groupes générique, français, européen et secrets, la France d'abord pour qu'un SIRET ou un NIR ne soit pas pris pour une carte bancaire. Le défaut de piighost-api." }
tags = ["international", "fr", "eu", "us", "chat", "tool-agent"]
piighost = ">=1.7,<2"

[[detectors]]
name = "regex-fr"
type = "regex"
groups = ["piighost/fr"]

[[detectors]]
name = "regex-eu"
type = "regex"
groups = ["piighost/eu"]

[[detectors]]
name = "regex-us"
type = "regex"
groups = ["piighost/us"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

[stages.linker]
type = "exact"

[stages.anonymizer.placeholder]
type = "label_counter"
