schema_version = 1

[pattern]
name = "at-phone"
title = { en = "phone number (Austria)", fr = "numéro de téléphone (Autriche)" }
label = "AT_PHONE"
tags = ["at", "contact"]
regex = '(?<![\w+])(?:\+43|0)(?:[\s./-]?\d){6,13}(?!\w)'

[pattern.description]
en = "Austrian phone number, the +43 country code or the 0 trunk prefix then six to thirteen digits, since Austrian subscriber numbers vary in length. The slash is a separator here, as Austrian writing uses it between the area code and the number."
fr = "Numéro de téléphone autrichien, l'indicatif +43 ou le préfixe interurbain 0 puis six à treize chiffres, la longueur des numéros d'abonné variant en Autriche. La barre oblique est un séparateur ici, l'écriture autrichienne l'utilisant entre l'indicatif et le numéro."

[[examples.match]]
text = "Die Zentrale erreichen Sie unter +43 1 53340."
value = "+43 1 53340"

[[examples.match]]
text = "Mobil bin ich unter 0664/1234567 erreichbar."
value = "0664/1234567"

[[examples.no_match]]
text = "Die Klappe lautet 0123"

[[examples.no_match]]
text = "Bestellnummer 4711"

[redos]
prefix = "+43 "
filler = "1"
suffix = "x"
