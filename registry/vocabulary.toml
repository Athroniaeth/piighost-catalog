# Vocabulaire fermé des tags. Un manifeste ne peut porter qu'un tag défini ici :
# `hub check` rejette tout autre. Le site dérive ses facettes du champ `kind`,
# pas des manifestes, ce qui laisse aux auteurs une simple liste à plat.
#
# Trois familles ne se tapent pas, elles se déduisent : officiel ou communautaire
# vient de l'espace de noms, regex seul ou modèle local ou clé d'API vient du
# contenu d'une config, retiré vient du statut d'un commit.

# ---- region : le pays ou la zone dont le format est propre --------------------
[international]
kind = "region"
label = { en = "International", fr = "International" }

[fr]
kind = "region"
label = { en = "France", fr = "France" }

