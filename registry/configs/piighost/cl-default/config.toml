schema_version = 1

[config]
name = "cl-default"
title = { en = "Chile, regex only", fr = "Chili, regex seules" }
description = { en = "Chile without a model: phone and the RUT, which serves as both the personal and the company identifier, plus the email, URL, IPv4 and card number that belong to no country. Word-boundary expansion catches a value detected once everywhere else in the message.", fr = "Chili sans modèle : téléphone et le RUT, qui sert d'identifiant à la fois personnel et d'entreprise, plus l'e-mail, l'URL, l'IPv4 et le numéro de carte qui n'appartiennent à aucun pays. L'expansion par mot entier reprend partout dans le message une valeur détectée une fois." }
tags = ["chat", "cl", "customer-support", "document"]
piighost = ">=2.0,<3"

[[detectors]]
name = "regex-cl"
type = "regex"
groups = ["piighost/cl"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

[stages.linker]
type = "exact"

[stages.expander]
type = "word_boundary"

[stages.anonymizer.placeholder]
type = "label_counter"
