schema_version = 1

[config]
name = "br-default"
title = { en = "Brazil, regex only", fr = "Brésil, regex seules" }
description = { en = "Brazil without a model: phone, CEP postal code, the CPF for a person, the CNPJ for a company and the CNS health number, plus the email, URL, IPv4 and card number that belong to no country. Word-boundary expansion catches a value detected once everywhere else in the message.", fr = "Brésil sans modèle : téléphone, code postal CEP, le CPF pour une personne, le CNPJ pour une entreprise et le numéro de santé CNS, plus l'e-mail, l'URL, l'IPv4 et le numéro de carte qui n'appartiennent à aucun pays. L'expansion par mot entier reprend partout dans le message une valeur détectée une fois." }
tags = ["br", "chat", "customer-support", "document"]
piighost = ">=2.0,<3"

[[detectors]]
name = "regex-br"
type = "regex"
groups = ["piighost/br"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

[stages.linker]
type = "exact"

[stages.expander]
type = "word_boundary"

[stages.anonymizer.placeholder]
type = "label_counter"
