schema_version = 1

[config]
name = "mx-default"
title = { en = "Mexico, regex only", fr = "Mexique, regex seules" }
description = { en = "Mexico without a model: phone, the CURP population identifier and the RFC tax number, plus the email, URL, IPv4 and card number that belong to no country. Word-boundary expansion catches a value detected once everywhere else in the message.", fr = "Mexique sans modèle : téléphone, l'identifiant de population CURP et le numéro fiscal RFC, plus l'e-mail, l'URL, l'IPv4 et le numéro de carte qui n'appartiennent à aucun pays. L'expansion par mot entier reprend partout dans le message une valeur détectée une fois." }
tags = ["chat", "customer-support", "document", "mx"]
piighost = ">=2.0,<3"

[[detectors]]
name = "regex-mx"
type = "regex"
groups = ["piighost/mx"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

[stages.linker]
type = "exact"

[stages.expander]
type = "word_boundary"

[stages.anonymizer.placeholder]
type = "label_counter"
