schema_version = 1

[pattern]
name = "fr-phone"
title = { en = "phone number (France)", fr = "numéro de téléphone (France)" }
label = "FR_PHONE"
tags = ["fr", "contact"]
regex = '(?<![\w+])(?:\+33[   ]?(?:\(0\)[   ]?)?|0)[1-9](?:[\s  .-]?\d{2}){4}(?!\w)'

[pattern.description]
en = "French phone number: +33 or a leading 0, one non-zero digit, then four pairs of digits separated by optional spaces, dots or hyphens. Lookarounds replace \\b so the + prefix anchors properly, and they guard the whole word rather than digits alone: otherwise ten digits in the middle of an API key get tokenised, cutting the key in two. This is the one departure from the pattern piighost 1.x shipped. The patterns compile under re.ASCII, where \\s misses the no-break spaces (U+00A0, U+202F) French typography puts between the pairs, so both are listed. The written international forms +33 6 39... and +33 (0)6 39... are matched."
fr = "Numéro de téléphone français : +33 ou un 0 initial, un chiffre non nul, puis quatre paires de chiffres séparées par des espaces, points ou tirets optionnels. Des lookarounds remplacent \\b pour ancrer correctement le préfixe +, et ils portent sur le mot entier et non sur les seuls chiffres : autrement dix chiffres au milieu d'une clé d'API se font tokeniser, ce qui coupe la clé en deux. C'est le seul écart avec le motif que livrait piighost 1.x. Les motifs sont compilés sous re.ASCII, où \\s ne reconnaît pas les espaces insécables (U+00A0, U+202F) que la typographie française place entre les paires, donc les deux sont listées. Les formes internationales écrites +33 6 39... et +33 (0)6 39... sont reconnues."

# 06 39 98 xx xx et 01 99 00 xx xx : tranches réservées à la fiction par l'ARCEP.
[[examples.match]]
text = "Appelez le 06 39 98 12 34 demain."
value = "06 39 98 12 34"

[[examples.match]]
text = "Joignable au +33639981234 en journée."
value = "+33639981234"

[[examples.match]]
text = "Standard : 01.99.00.12.34"
value = "01.99.00.12.34"

# Espaces insécables entre les paires, comme les pose la typographie française.
[[examples.match]]
text = "Tél. 06\u00a039\u00a098\u00a012\u00a034 en journée."
value = "06\u00a039\u00a098\u00a012\u00a034"

[[examples.match]]
text = "Depuis l'étranger : +33 6 39 98 12 34."
value = "+33 6 39 98 12 34"

[[examples.match]]
text = "Ou le +33 (0)1 99 00 12 34 pour le standard."
value = "+33 (0)1 99 00 12 34"

# Quatre groupes seulement.
[[examples.no_match]]
text = "06 39 98 12"

# Un chiffre de trop : refusé par le lookahead.
[[examples.no_match]]
text = "0639981234567"

# Dix chiffres au milieu d'une clé d'API. Les gardes portent sur le mot entier
# et pas seulement sur les chiffres : sans cela le motif découpe une clé en
# deux et en tokenise le milieu, ce qu'un exemple long a révélé.
[[examples.no_match]]
text = "sk-proj-abcdefghijklmnopqrstuvwxyz0123456789ABCD"

[redos]
prefix = "06 39 98 "
filler = "1 "
suffix = "x"
