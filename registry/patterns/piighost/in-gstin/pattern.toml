schema_version = 1

[pattern]
name = "in-gstin"
title = { en = "GSTIN (India)", fr = "GSTIN (Inde)" }
label = "IN_GSTIN"
tags = ["in", "government-id", "business", "finance"]
regex = '(?<!\w)[0-3]\d[A-Z]{5}\d{4}[A-Z][A-Z0-9]Z[A-Z0-9](?!\w)'

[pattern.description]
en = "Indian GST identification number: the state code, the holder's PAN, an entity digit, a fixed Z, then a checksum character. The Z in the fourteenth position is a constant, which makes this fifteen character string one of the safest business identifiers to detect."
fr = "Numéro d'identification GST indien : le code d'état, le PAN du titulaire, un chiffre d'entité, un Z fixe, puis un caractère de contrôle. Le Z en quatorzième position est une constante, ce qui fait de cette chaîne de quinze caractères l'un des identifiants d'entreprise les plus sûrs à détecter."

[[examples.match]]
text = "The invoice carries 27AAPFU0939F1ZV as the GSTIN."
value = "27AAPFU0939F1ZV"

[[examples.match]]
text = "Register under 29AABCU9603R1ZM for Karnataka."
value = "29AABCU9603R1ZM"

[[examples.no_match]]
text = "The code 27AAPFU0939F1XV has no Z"

[[examples.no_match]]
text = "Reference 27AAPFU0939F1Z"

[redos]
prefix = "27AAPFU"
filler = "0939"
suffix = "x"
