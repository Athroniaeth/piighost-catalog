schema_version = 1

[pattern]
name = "ch-phone"
title = { en = "phone number (Switzerland)", fr = "numéro de téléphone (Suisse)" }
label = "CH_PHONE"
tags = ["ch", "contact"]
regex = '(?<![\w+])(?:\+41|0)(?:[\s./-]?\d){9}(?!\w)'

[pattern.description]
en = "Swiss phone number, the +41 country code or the 0 trunk prefix then nine digits. Swiss writing uses the space and the slash between the area code and the number, so both are accepted as separators."
fr = "Numéro de téléphone suisse, l'indicatif +41 ou le préfixe interurbain 0 puis neuf chiffres. L'écriture suisse emploie l'espace et la barre oblique entre l'indicatif et le numéro, donc les deux sont acceptés comme séparateurs."

[[examples.match]]
text = "Rufen Sie +41 44 668 18 00 an, bitte."
value = "+41 44 668 18 00"

[[examples.match]]
text = "Mein Handy ist 079 123 45 67 tagsüber."
value = "079 123 45 67"

[[examples.no_match]]
text = "Die Klappe ist 0123"

[[examples.no_match]]
text = "Bestellung 123456789"

[redos]
prefix = "+41 "
filler = "44"
suffix = "x"
