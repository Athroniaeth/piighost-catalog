schema_version = 1

[group]
name = "secrets-extended"
title = { en = "every secret and credential", fr = "tous les secrets et jetons" }
description = { en = "Every credential shape the catalog knows: the four of the `secrets` group plus Anthropic, Google, Slack, Twilio, SendGrid, Azure, npm, PyPI, GitLab, Mailgun, DigitalOcean, the Google OAuth client id, the AWS secret key, JWTs, bearer tokens, SSH public keys, PEM private key blocks and PEM certificate blocks, and the three credentials that live inside a URL: a Slack webhook, a database URL and HTTP basic auth. A certificate is here because it carries the subject's name, organisation and often an email address in clear text. Several of these contain long digit runs, so a phone or card pattern in the same detector claims part of them: declare this group first, or keep it in a detector of its own. The URL-shaped three start where a URL starts and must be declared ahead of it, which is why the `logs` group leaves URL out entirely.", fr = "Toutes les formes de secrets que connaît le catalogue : les quatre du groupe `secrets` plus Anthropic, Google, Slack, Twilio, SendGrid, Azure, npm, PyPI, la clé secrète AWS, les JWT, les jetons bearer, les blocs de clé privée PEM et les blocs de certificat PEM. Un certificat figure ici parce qu'il porte en clair le nom du sujet, son organisation et souvent une adresse e-mail. Plusieurs contiennent de longues suites de chiffres, donc un motif de téléphone ou de carte dans le même détecteur en revendique une partie : déclarez ce groupe en premier, ou gardez-le dans un détecteur à part." }
tags = ["international", "secrets", "software-dev", "code-assistant", "logs"]

# Longest and most distinctive first: a PEM block and a JWT carry the widest
# spans, so they take their ground before anything narrower is tried. The three
# URL-shaped credentials come with them, ahead of anything a URL could claim.
