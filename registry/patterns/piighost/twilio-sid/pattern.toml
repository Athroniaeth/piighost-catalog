schema_version = 1

[pattern]
name = "twilio-sid"
title = { en = "Twilio SID", fr = "SID Twilio" }
label = "TWILIO_SID"
tags = ["international", "secrets", "software-dev"]
regex = '\b(?:AC|SK)[0-9a-fA-F]{32}\b'

[pattern.description]
en = "Twilio resource identifier: the AC account SID and the SK API key SID, each followed by thirty-two hex characters. The account SID is half of the basic-auth pair and travels with the auth token in practice. That auth token is itself a bare thirty-two character hex string with no prefix and is deliberately not matched: on shape alone nothing tells it from a digest. A prefixed hex digest of the same shape would match, which is rare. No collision."
fr = "Identifiant de ressource Twilio : le SID de compte AC et le SID de clé d'API SK, chacun suivi de trente-deux caractères hexadécimaux. Le SID de compte est la moitié de la paire d'authentification basique et voyage en pratique avec le jeton d'authentification. Ce jeton est lui-même une suite nue de trente-deux caractères hexadécimaux sans préfixe : il n'est volontairement pas reconnu, car rien dans sa forme ne le distingue d'une empreinte. Une empreinte hexadécimale préfixée de la même forme serait reconnue, ce qui reste rare. Aucune collision."

# SID de compte inventé.
[[examples.match]]
text = "TWILIO_ACCOUNT_SID=AC0123456789abcdef0123456789abcdef"
value = "AC0123456789abcdef0123456789abcdef"

# SID de clé d'API inventé.
[[examples.match]]
text = "La clé d'API SKdeadbeefdeadbeefdeadbeefdeadbeef est encore active."
value = "SKdeadbeefdeadbeefdeadbeefdeadbeef"

# Trop court.
[[examples.no_match]]
text = "AC0123456789"

# Des caractères non hexadécimaux.
[[examples.no_match]]
text = "ACzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz"

[redos]
prefix = "AC"
filler = "a"
suffix = "!"
