schema_version = 1

[pattern]
name = "nl-phone"
title = { en = "phone number (Netherlands)", fr = "numéro de téléphone (Pays-Bas)" }
label = "NL_PHONE"
tags = ["nl", "contact"]
regex = '(?<![\w+])(?:\+31[\s.-]?|0)(?:6[\s.-]?\d{8}|\d{2,3}[\s.-]?\d{6,7})(?!\w)'

[pattern.description]
en = "Dutch phone number: the +31 or leading 0 prefix, then 6 followed by eight digits for a mobile, or an area code and the subscriber number for a landline."
fr = "Numéro de téléphone néerlandais : le préfixe +31 ou un 0 initial, puis 6 suivi de huit chiffres pour un mobile, ou un indicatif de zone et le numéro d'abonné pour un fixe."

[[examples.match]]
text = "Bel +31 6 12345678 na tienen."
value = "+31 6 12345678"

[[examples.match]]
text = "Kantoor 020 1234567 op werkdagen."
value = "020 1234567"

[[examples.no_match]]
text = "Bel 612345678"

[[examples.no_match]]
text = "Bel +31 6 1234"

[redos]
prefix = "+31 6 "
filler = "12"
suffix = "x"
